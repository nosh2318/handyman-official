  window.mgSw=function(x){var f=document.getElementById('mgFlow');if(f)f.setAttribute('data-s',x);document.querySelectorAll('.sw button').forEach(function(b){b.classList.toggle('on',b.getAttribute('data-s')===x);});try{if(window.KDT&&KDT.event)KDT.event('click','mg_sw_'+x);}catch(e){}};
  function apply(){var L=(window.hdmLang?window.hdmLang():'ja');var d=P[L]||P.ja;
    document.querySelectorAll('[data-i18n]').forEach(function(el){var k=el.getAttribute('data-i18n');if(d[k]!=null)el.innerHTML=d[k];});}
  var prev=window.hdmOnLang;window.hdmOnLang=function(L){try{apply();}catch(e){}if(typeof prev==='function')try{prev(L);}catch(e){}};
  if(window.hdmLang)apply();document.addEventListener('DOMContentLoaded',apply);setTimeout(apply,80);
})();
